# Run 3: Qwen3.5-9B on 8x A100-40GB. 4 vLLM replicas (data parallel) + 4 trainer GPUs in ONE 4-way Ulysses
# context-parallel group: a 131k micro-batch's activations (~40 GB on one card) split four ways plus the sharded
# bf16 base fit a 40 GB card with activation checkpointing and no offloading. Rewards: judge score, group-centered
# (4 rollouts per task, judged together in one call), fed to the KLPO binary-KL loss with beta = 2 and omega clipped.
# Launch: CLEAN=1 RUN_NAME=jev9b-v3 MODEL_CFG=rl-v3-9b-40gb.toml sh /workspace/jev-browser-rl/scripts/run/relaunch_all.sh

max_steps = 40
seq_len = 131072
output_dir = "/workspace/prl-runs"

[run]
name = "jev9b-v3"

[model]
name = "/workspace/models/Qwen3.5-9B"

[deployment]
type = "single_node"
num_infer_gpus = 4
num_train_gpus = 4

[weight_broadcast]
type = "filesystem"

[ckpt]
interval = 1
keep_last = 2

[monitors.file]

# --- Trainer ---
[trainer.model]
impl = "custom"
optimization_dtype = "bfloat16"
fused_lm_head_token_chunk_size = 2048
cp = 4
cp_style = "ulysses"

[trainer.model.ac]
# No activation offloading (see rl-v2-9b.toml). Fallback if the trainer OOMs or crashes: cp = 2, seq_len = 65536.

[trainer.model.lora]
rank = 8
alpha = 32
dropout = 0.0

[trainer.optim]
lr = 1.5e-5
weight_decay = 0.0

[trainer.scheduler]
type = "linear"
warmup_steps = 3
decay_steps = 0

[trainer.loss]
type = "custom"
import_path = "klpo_prime.klpo_binary_loss"
[trainer.loss.kwargs]
beta = 2.0                       # regression target per token = advantage / beta; keep it well under 1 nat
omega_max = 10.0                 # binary-KL correction weight is clipped to [0.1, 10]

# --- Orchestrator ---
[orchestrator]
batch_size = 32                  # 8 tasks x 4 rollouts per step
max_off_policy_steps = 2

[orchestrator.model.lora]

[orchestrator.train]
group_size = 4

[orchestrator.train.algo]
type = "grpo"                    # group-relative centering; KLPO loss consumes the centered advantage as R

[orchestrator.train.sampling]
max_completion_tokens = 16384

[orchestrator.concurrency]
initial_inflight = 32
max_inflight = 32

[orchestrator.renderer]
name = "qwen3.5"

[[orchestrator.train.source]]
name = "jev-browser-train"
env.taskset.id = "jev-browser"
env.taskset.split = "train"
env.taskset.task.minutes = 15     # the ONE budget: told to the policy, agent timeout = this + 1 min grace
env.taskset.task.judge_group = 4  # the 4 rollouts of a task are judged in one call (consistent group scores)
env.agent.harness.id = "jev-pi"
env.agent.harness.env = { JEV_PI_CONTEXT_WINDOW = "131072" }
env.agent.harness.disabled_tools = ["bash", "read", "write", "edit", "grep", "find", "ls", "mcpScript"]
env.agent.runtime.type = "subprocess"

[orchestrator.eval]
interval = 5

[[orchestrator.eval.source]]
name = "jev-browser-val"
env.taskset.id = "jev-browser"
env.taskset.split = "val"
env.taskset.val_repeats = 3        # 10 held-out tasks x 3 rollouts per eval
env.taskset.task.minutes = 15
env.agent.harness.id = "jev-pi"
env.agent.harness.env = { JEV_PI_CONTEXT_WINDOW = "131072" }
env.agent.harness.disabled_tools = ["bash", "read", "write", "edit", "grep", "find", "ls", "mcpScript"]
env.agent.runtime.type = "subprocess"

# --- Inference ---
# Port 8000 belongs to the Vast portal's caddy; 8080 to its Jupyter (the dashboard runs on DASH_PORT=8081).
[inference.server]
port = 8100

[orchestrator.model.client]
base_url = "http://localhost:8100/v1"

[inference.vllm]
data_parallel_size = 4
max_model_len = 131072
gpu_memory_utilization = 0.90
max_num_seqs = 8
enable_lora = true
max_lora_rank = 8
enable_auto_tool_choice = true
tool_call_parser = "qwen3_coder"
reasoning_parser = "qwen3"
