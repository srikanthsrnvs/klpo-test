# prime-rl: KLPO (binary KL) + LoRA on Qwen3.6-35B-A3B, jev-browser taskset, DeepSeek judge reward.
# 2xA100-80GB single node: GPU0 = vLLM on Qwen's official FP8 checkpoint (~36 GB weights, Marlin FP8 kernels on
# Ampere) + our LoRA adapter, leaving ~35 GB of KV for 8 concurrent rollouts. GPU1 = trainer: bf16 frozen base
# (~73 GB) + LoRA with FSDP CPU offload; activations are checkpointed and offloaded. KLPO's log(p/q) term absorbs the
# FP8-sampler vs bf16-trainer mismatch (that is what the off-policy correction is for). prime-rl hands out whole GPUs
# (inference first, trainer next); pooling both for inference AND training would need vLLM sleep-mode time-sharing,
# which prime-rl does not implement. (tools/convert_bf16_to_fp8.py skips this model's fused expert tensors, hence
# the official checkpoint.)
#
# LoRA choices follow Thinking Machines, "LoRA Without Regret" (thinkingmachines.ai/blog/lora):
#  - LoRA on ALL layers incl. the MoE experts (attention-only LoRA underperforms; prime-rl's default target list
#    already covers q/k/v/o, gate/up/down and the grouped experts).
#  - Policy-gradient RL absorbs ~1 bit per episode, so capacity is not the constraint: rank 1 matches full FT in
#    their RL experiments. Rank 8 here; alpha = 32 with prime-rl's alpha/rank scaling is the 1/r convention that
#    makes the optimal LR roughly rank-independent.
#  - Optimal LoRA LR is ~10x the full-FT LR, ~15x for short (~100-step) runs. prime-rl's full-FT default is 1e-6,
#    so 1.5e-5. No weight decay on the adapter.
#  - LoRA tolerates large batches worse than full FT, so the batch is small: 8 rollouts per step, one rollout per
#    task (KLPO needs no group).
# Launch: sh /workspace/jev-browser-rl/scripts/run/start_rl.sh   (stops the standalone vLLM, checks the tool server, runs `rl`)

max_steps = 100
seq_len = 131072
output_dir = "/workspace/prl-runs"

[run]
name = "jev-klpo-r16"

[deployment]
type = "single_node"
num_infer_gpus = 1
num_train_gpus = 1

[weight_broadcast]
type = "filesystem"

[ckpt]
interval = 5
keep_last = 2

[monitors.file]

# --- Trainer ---

# prime-rl forbids a shared [model] when inference uses a different checkpoint: the trainer differentiates through
# the bf16 base, the orchestrator and vLLM use the FP8 base (they must name the same model).
[trainer.model]
name = "/workspace/models/Qwen3.6-35B-A3B"
impl = "custom"
# 36.4B params incl. vision tower + MTP head = 72.7 GB bf16, plus the adapter in fp32: does not fit one 80 GB card
# at any rank, so the frozen weights stream from pinned host RAM (~2 min/step at PCIe speed; rollouts take 10-15).
fsdp_cpu_offload = true
optim_cpu_offload = false        # prime-rl forbids combining the two offload modes

[trainer.model.ac]

[trainer.model.lora]
rank = 8                         # RL saturates at rank 1 in the TM experiments; r16 over 256 experts x 40 layers was 1.27B params
alpha = 32
dropout = 0.0

[trainer.optim]
lr = 1.5e-5
weight_decay = 0.0

[trainer.scheduler]
type = "linear"
warmup_steps = 5
decay_steps = 0

[trainer.loss]
type = "custom"
import_path = "klpo_prime.klpo_binary_loss"
[trainer.loss.kwargs]
beta = 2.0                       # regression target per token = advantage / beta; keep it well under 1 nat
omega_max = 10.0                 # binary-KL correction weight is clipped to [0.1, 10]

# --- Orchestrator ---

[orchestrator]
batch_size = 8
max_off_policy_steps = 4

[orchestrator.model]
name = "/workspace/models/Qwen3.6-35B-A3B-FP8-official"

[orchestrator.model.lora]

[orchestrator.train]
group_size = 1

[orchestrator.train.algo]
type = "raw"                     # advantage = judge score (KLPO's R), no baseline

[orchestrator.train.sampling]
max_completion_tokens = 16384

[orchestrator.concurrency]
initial_inflight = 8
max_inflight = 8

[orchestrator.renderer]
name = "qwen3.6"

[[orchestrator.train.source]]
name = "jev-browser-train"
env.taskset.id = "jev-browser"
env.taskset.split = "train"
env.taskset.task.minutes = 15
env.taskset.tools.url = "http://127.0.0.1:18100/mcp"
env.agent.harness.id = "jev-pi"
env.agent.harness.disabled_tools = ["bash", "read", "write", "edit", "grep", "find", "ls"]
env.agent.runtime.type = "subprocess"

[orchestrator.eval]
interval = 10

[[orchestrator.eval.source]]
name = "jev-browser-val"
env.taskset.id = "jev-browser"
env.taskset.split = "val"
env.taskset.task.minutes = 15
env.taskset.tools.url = "http://127.0.0.1:18100/mcp"
env.agent.harness.id = "jev-pi"
env.agent.harness.disabled_tools = ["bash", "read", "write", "edit", "grep", "find", "ls"]
env.agent.runtime.type = "subprocess"

# --- Inference ---
# Port 8000 belongs to the Vast portal's caddy on this box.
[inference.server]
port = 8100

[orchestrator.model.client]
base_url = "http://localhost:8100/v1"

[inference.vllm]
model = "/workspace/models/Qwen3.6-35B-A3B-FP8-official"
max_model_len = 131072
gpu_memory_utilization = 0.90
max_num_seqs = 8                 # hybrid attention: ~2.6 GB KV per 131k sequence
enable_lora = true
max_lora_rank = 8
enable_auto_tool_choice = true
tool_call_parser = "qwen3_coder"
reasoning_parser = "qwen3"
