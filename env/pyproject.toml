[project]
name = "jev-browser"
version = "0.1.0"
description = "verifiers v1 taskset: BU Bench V2 tasks solved through the jev-browser harness, judged by DeepSeek."
requires-python = ">=3.12"
dependencies = ["verifiers", "jev-ultrafast", "cryptography>=42"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jev_browser", "jev_pi"]
